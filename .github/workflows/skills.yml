name: Check skills
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'exercises/skills/**'
permissions:
  contents: read
  pull-requests: read
  id-token: write
jobs:
  grade:
    uses: TensorOpsAI/tensorlearn-claude-graders/.github/workflows/grade.yml@4b18ebe90059d2422750c3fb10232a04bdd985c3
    with:
      grader-sha: 4b18ebe90059d2422750c3fb10232a04bdd985c3
      exercise-key: skills
