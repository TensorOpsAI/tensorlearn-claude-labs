name: Check release
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'exercises/release/**'
permissions:
  contents: read
  pull-requests: read
  id-token: write
jobs:
  grade:
    uses: TensorOpsAI/tensorlearn-claude-graders/.github/workflows/grade.yml@e2a2ce8b5e9883bae2547907292b26cf8e283aaf
    with:
      grader-sha: e2a2ce8b5e9883bae2547907292b26cf8e283aaf
      exercise-key: release
