name: Check spec-plan
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'exercises/spec-plan/**'
permissions:
  contents: read
  pull-requests: read
  id-token: write
jobs:
  grade:
    uses: TensorOpsAI/tensorlearn-claude-graders/.github/workflows/grade.yml@265a4a2c73c13a27f8982744fe31e04d838817ac
    with:
      grader-sha: 265a4a2c73c13a27f8982744fe31e04d838817ac
      exercise-key: spec-plan
