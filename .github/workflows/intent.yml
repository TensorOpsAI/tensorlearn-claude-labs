name: Check intent
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'exercises/intent/**'
permissions:
  contents: read
  pull-requests: read
jobs:
  grade:
    uses: TensorOpsAI/tensorlearn-claude-graders/.github/workflows/grade.yml@76fd4bb40ef1d7b212b3d1172a613ba665a75343
    with:
      grader-sha: 76fd4bb40ef1d7b212b3d1172a613ba665a75343
      exercise-key: intent
